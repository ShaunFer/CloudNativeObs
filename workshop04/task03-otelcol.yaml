---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: task03-otelcol
  namespace: workshop04
spec:
  # gateway
  mode: statefulset
  replicas: 1
  image: otel/opentelemetry-collector-contrib:latest
  imagePullPolicy: IfNotPresent
  serviceAccount: otel-collector-sa
  resources:
    requests:
      memory: 512Mi
      # 1 vcpu == 1000m
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 200m
  # otel configuration
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        # view /debug/tracez
        endpoint: 0.0.0.0:55679

    processors:
      batch: {}
      memory_limiter:
        limit_mib: 1024
        spike_limit_mib: 410
        check_interval: 5

    receivers:
      prometheus:
        config:
          scrape_configs:
          - job_name: k8s-pods
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            # workshop04;true
            - source_labels: [ __meta_kubernetes_namespace, __meta_kubernetes_pod_annotation_prometheus_io_scrape ]
              regex: workshop04;true
              action: keep
            # 10.10.7.7;9464 => 10.10.7.7:9464
            - source_labels: [ __meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port ]
              regex: (.+);(.+)
              action: replace
              target_label: __address__
              replacement: $1:$2
            - source_labels: [ __meta_kubernetes_pod_ready ]
              regex: (.+)
              action: replace
              target_label: k8s_pod_ready
              replacement: $1
            - source_labels: [ __meta_kubernetes_pod_phase ]
              regex: (.+)
              action: replace
              target_label: k8s_pod_phase
              replacement: $1
            # labels:
            #   prometheus.io/name: <name>   => job: <name>
            # Set job (not a custom "service_name" label) so the OTel prometheus
            # receiver's built-in job->service.name derivation produces a clean
            # service_name, instead of colliding with the job-derived service.name
            # ("k8s-pods") and getting concatenated as "k8s-pods;<name>".
            #- source_labels: [ __meta_kubernetes_pod_label_prometheus_io_name ]
            #  regex: (.+)
            #  action: replace
            #  target_label: service_name
            #  replacement: $1
            #- source_labels: [ __meta_kubernetes_namespace ]
            #  regex: workshop04
            #  action: keep
            ## annotations:
            ##   prometheus.io/scrape: 'true'
            #- source_labels: [ __meta_kubernetes_pod_annotations_prometheus_io_scrape ]
            #  regex: true
            #  action: keep

    exporters:
      prometheusremotewrite:
        endpoint: http://prom-stack-kube-prometheus-prometheus.prometheus:9090/api/v1/write
        tls:
          insecure: true
        resource_to_telemetry_conversion:
          enabled: true

      debug:
        # basic, normal, detailed
        verbosity: detailed
        sampling_initial: 1
        sampling_thereafter: 100

    service:
      extensions: [ health_check, zpages ]
      pipelines:
        metrics:
          receivers: [ prometheus ]
          processors: [ batch, memory_limiter ]
          exporters: [ prometheus_remote_write, debug ]
